# The ONLY workflow allowed to publish anything. Human-triggered, never automatic:
# the runner's never-push invariant extends to CI — no job pushes code or publishes
# packages as a side effect of merging.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: install
        run: pnpm install --frozen-lockfile

      - name: verify
        run: pnpm check-types && pnpm lint && pnpm test && pnpm build

      - name: publish
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
