name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: check-types
        run: pnpm check-types

      - name: lint
        run: pnpm lint

      - name: test
        run: pnpm test

      - name: build
        run: pnpm build

  workflow-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: verify-workflow
        run: pnpm verify:workflow

      # Explicit per-check steps so `gate check --wiring` sees each gate in an
      # executing CI surface (the bundle above runs them too — the seconds of
      # duplication buy an honest wire-or-delete audit).
      - name: verify-brain
        run: pnpm verify:brain

      - name: verify-review-artifact
        run: pnpm verify:review-artifact

      - name: verify-durable-artifacts
        run: pnpm verify:durable-artifacts

      - name: verify-deferred
        run: pnpm verify:deferred

      - name: verify-test-task-coverage
        run: pnpm verify:test-task-coverage

      - name: verify-gates-wired
        run: pnpm verify:gates-wired

      - name: verify-pack-drift
        run: pnpm verify:pack-drift

      - name: verify-turbo-inputs
        run: pnpm verify:turbo-inputs

      - name: verify-dependency-audit
        run: pnpm verify:dependency-audit
