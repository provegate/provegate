name: CI

on:
  push:
    branches: [main, staging, development]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: check-types
        run: pnpm check-types

      - name: lint
        run: pnpm lint

      - name: test
        run: pnpm test

      - name: build
        run: pnpm build

      # PRD-026 FR-4: the CLI sweeps, after the build that produces the CLI.
      - name: check-review-artifacts
        run: pnpm check:review-artifacts

      - name: check-durable-artifacts
        run: pnpm check:durable-artifacts

      - name: check-wiring
        run: pnpm check:wiring

      # A built-CLI gate placed after this job's build (the hygiene job runs
      # built-CLI checks too since PRD-034 — it builds the package before its
      # aggregate step). This was the first `gate` invocation on any automated
      # surface of this repository.
      - name: verify-value-score
        run: pnpm verify:value-score

  workflow-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      # provegate's tsup inlines @provegate/design (a devDependency — the
      # zero-runtime-deps rule holds), so its dist must exist before the CLI
      # build on a clean checkout.
      - name: build-design
        run: pnpm --filter @provegate/design build

      # PRD-034: verify-prompts (a bundle member and an explicit step below)
      # executes the built CLI; a clean checkout has no dist/, so build before
      # the aggregate. The order is asserted by `verify:prompts --assert-ci-order`.
      - name: build-provegate
        run: pnpm --filter provegate build

      - name: verify-workflow
        run: pnpm verify:workflow

      # Explicit per-check steps so `gate check --wiring` sees each gate in an
      # executing CI surface (the bundle above runs them too — the seconds of
      # duplication buy an honest wire-or-delete audit).
      - name: verify-doc-claims
        run: pnpm verify:doc-claims

      - name: verify-brain
        run: pnpm verify:brain

      - name: verify-deferred
        run: pnpm verify:deferred

      - name: verify-test-task-coverage
        run: pnpm verify:test-task-coverage

      - name: verify-pack-drift
        run: pnpm verify:pack-drift

      - name: verify-script-classes
        run: pnpm verify:script-classes

      - name: verify-turbo-inputs
        run: pnpm verify:turbo-inputs

      - name: verify-dependency-audit
        run: pnpm verify:dependency-audit

      # PRD-034: the reconciliation check (dormant until PRD-032 enables
      # prompts here) and its own hygiene-job order assertion.
      - name: verify-prompts
        run: pnpm verify:prompts

      - name: verify-prompts-ci-order
        run: pnpm verify:prompts -- --assert-ci-order

  # The delivery gate: install the packed CLI into a plain npm + tsc repo and
  # drive one PRD to a merged close. Every other job reads this source tree, so
  # none of them can observe what an install actually hands an adopter.
  adopter-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: build-design
        run: pnpm --filter @provegate/design build

      - name: build-provegate
        run: pnpm --filter provegate build

      - name: adopter-smoke
        run: pnpm smoke:adopter
