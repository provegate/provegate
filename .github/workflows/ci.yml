name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: check-types
        run: pnpm check-types

      - name: lint
        run: pnpm lint

      - name: test
        run: pnpm test

      - name: build
        run: pnpm build

      # PRD-026 FR-4: the CLI sweeps, after the build that produces the CLI.
      - name: check-review-artifacts
        run: pnpm check:review-artifacts

      - name: check-durable-artifacts
        run: pnpm check:durable-artifacts

      - name: check-wiring
        run: pnpm check:wiring

      # The ONLY gate that runs the built CLI, so it lives here rather than in
      # the hygiene job — that job installs but never builds, and a check whose
      # first act is to require `dist/` would report the absence of a build as a
      # governance violation. This is also the first `gate` invocation on any
      # automated surface of this repository.
      - name: verify-value-score
        run: pnpm verify:value-score

  workflow-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: verify-workflow
        run: pnpm verify:workflow

      # Explicit per-check steps so `gate check --wiring` sees each gate in an
      # executing CI surface (the bundle above runs them too — the seconds of
      # duplication buy an honest wire-or-delete audit).
      - name: verify-doc-claims
        run: pnpm verify:doc-claims

      - name: verify-brain
        run: pnpm verify:brain

      - name: verify-deferred
        run: pnpm verify:deferred

      - name: verify-test-task-coverage
        run: pnpm verify:test-task-coverage

      - name: verify-pack-drift
        run: pnpm verify:pack-drift

      - name: verify-script-classes
        run: pnpm verify:script-classes

      - name: verify-turbo-inputs
        run: pnpm verify:turbo-inputs

      - name: verify-dependency-audit
        run: pnpm verify:dependency-audit
