<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;font-family:var(--pg-font-sans);background:var(--pg-surface);color:var(--pg-text);padding:22px}#r{display:grid;grid-template-columns:repeat(7,1fr);gap:14px}.cell{display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--pg-text)}.cell span{font-family:var(--pg-font-mono);font-size:10px;color:var(--pg-text-subtle)}.cell .box{width:100%;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid var(--pg-border);border-radius:var(--pg-radius-md)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head>
<body><div id="r"></div>
<script type="text/babel">
const { Icon } = window.DesignSystem_65dbcc;
const names = ["gate","check","cross","pending","human","machine","lock","exit0","merge","terminal","copy","arrowRight","chevronRight","github"];
const colors = { check:"var(--pg-pass)", cross:"var(--pg-fail)", pending:"var(--pg-pending)", human:"var(--pg-human)" };
ReactDOM.createRoot(document.getElementById("r")).render(
  <>{names.map(n => (
    <div className="cell" key={n}><div className="box" style={{color: colors[n] || "var(--pg-text)"}}><Icon name={n} size={24} /></div><span>{n}</span></div>
  ))}</>
);
</script></body></html>
