<!-- dsCard (reference copy) group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4px base grid" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">

<body>

<div class="col"><div class="bar" style="height:24px"></div><span class="n">5·24</span></div>
<div class="col"><div class="bar" style="height:32px"></div><span class="n">6·32</span></div>

</body></html>
