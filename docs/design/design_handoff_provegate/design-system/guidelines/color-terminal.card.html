<!-- dsCard (reference copy) group="Colors" viewport="700x170" name="Terminal Palette" subtitle="Always-dark CLI surface — theme-independent" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--pg-font-mono);background:var(--pg-term-bg);color:var(--pg-term-fg);padding:18px 20px;font-size:13px;line-height:1.7}.dim{color:var(--pg-term-dim)}.g{color:var(--pg-term-green)}.r{color:var(--pg-term-red)}.a{color:var(--pg-term-amber)}.h{color:var(--pg-term-human)}.dots{display:flex;gap:8px;margin-bottom:12px}.d{width:11px;height:11px;border-radius:50%}</style></head>
<body>
<div class="dots"><span class="d" style="background:var(--pg-term-green)"></span><span class="d" style="background:var(--pg-term-red)"></span><span class="d" style="background:var(--pg-term-amber)"></span><span class="d" style="background:var(--pg-term-human)"></span></div>
<div><span class="g">✓ test: unit</span> <span class="dim">pnpm test</span> ...... <span class="g">pass</span> <span class="dim">exit 0</span></div>
<div><span class="r">✗ e2e</span> <span class="dim">playwright test</span> ... <span class="r">fail</span> <span class="dim">exit 1</span></div>
<div><span class="a">◷ deploy</span> <span class="dim">awaiting</span> ......... <span class="a">pending</span></div>
<div><span class="h">▸ push</span> <span class="dim">— No. Push is yours.</span></div>
</body></html>
