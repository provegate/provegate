<!-- dsCard (reference copy) group="Colors" viewport="700x150" name="Surfaces — Light & Dark" subtitle="Both themes are first-class" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--pg-font-sans);padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:14px;background:var(--pg-warm-100)}.panel{border-radius:var(--pg-radius-md);padding:14px;border:1px solid}.card{border-radius:var(--pg-radius-sm);padding:10px 12px;font-size:13px;margin-top:8px}.tag{font-family:var(--pg-font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;opacity:.6}</style></head>
<body>
<div class="panel" style="background:#faf9f6;border-color:#e7e4db;color:#1c1a16"><span class="tag">light</span><div class="card" style="background:#fff;border:1px solid #e7e4db">surface / border / text</div></div>
<div class="panel" style="background:#14130d;border-color:#2a2721;color:#f3f1eb"><span class="tag">dark</span><div class="card" style="background:#1c1a16;border:1px solid #2a2721">surface / border / text</div></div>
</body></html>
