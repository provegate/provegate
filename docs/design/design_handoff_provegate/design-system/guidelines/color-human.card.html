<div class="chip">2258c0</div>
<div class="body">
<p><b>Human authority blue</b> marks the moments a person decides — phases 1–3 and push. It is deliberately <b>not</b> green, red, or amber, so an operator gate never reads as a status result.</p>
<p><code>--pg-human</code> <code>--pg-human-bg</code> <code>--pg-human-text</code> · also the link + focus color.</p>
