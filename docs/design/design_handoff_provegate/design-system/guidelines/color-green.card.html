<!-- dsCard (reference copy) group="Colors" viewport="700x150" name="Proof Green" subtitle="Exit-0 accent — earned, never decorative" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--pg-font-sans);background:var(--pg-surface);color:var(--pg-text);padding:20px 22px}.row{display:flex;gap:0;border-radius:var(--pg-radius-md);overflow:hidden;border:1px solid var(--pg-border)}.sw{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--pg-font-mono);font-size:10px;color:#fff}.lab{font-family:var(--pg-font-mono);font-size:11px;color:var(--pg-text-subtle);margin-top:10px}</style></head>
<body>
<div class="row">
<div class="sw" style="background:var(--pg-green-700)">700</div>
<div class="sw" style="background:var(--pg-green-600)">600</div>
<div class="sw" style="background:var(--pg-green-500)">500</div>
<div class="sw" style="background:var(--pg-green-400);color:#14130d">400</div>
</div>
<div class="lab">--pg-green-600 <span style="color:var(--pg-accent-text)">passes on white</span> · --pg-green-400 passes on near-black · use ONLY for passed / earned states</div>
</body></html>
